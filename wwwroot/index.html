<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d1d1d">
  <title>DART — Discover Art</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/themes.css">
  <script src="/catalog-logic.js" defer></script>
  <script src="/video-preview.js" defer></script>
  <script src="/media-duplicates.js" defer></script>
  <script src="/locales.js" defer></script>
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/desktop-shell.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <div class="tabs-bar" aria-label="Open tabs">
      <button id="install-update-button" class="install-update-button" type="button" title="Install update" aria-label="Install update" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v11.1l4.4-4.4 3.6 3.6L12 23 1 12.3l3.6-3.6L9 13.1V2z"/></svg></button>
      <div class="nav-arrows">
        <button id="back-button" class="icon-button" title="Back" aria-label="Back"></button>
        <button id="forward-button" class="icon-button" title="Forward" aria-label="Forward"></button>
      </div>
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="tab-list-button" class="tab-list-button" title="All tabs" aria-label="All tabs" aria-expanded="false" aria-controls="tab-list-panel"></button>
      <button id="new-tab-button" class="new-tab" title="New tab" aria-label="New tab">+</button>
      <div class="window-drag-space" aria-hidden="true"></div>
      <div id="window-controls" class="window-controls" aria-label="Window controls" hidden>
        <button type="button" data-window-command="minimize" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
        <button type="button" data-window-command="maximize" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 16 16"><path id="maximize-glyph" d="M3.5 3.5h9v9h-9z"/></svg></button>
        <button type="button" class="window-close" data-window-command="close" aria-label="Close window" title="Close window"><svg viewBox="0 0 16 16"><path d="m3.5 3.5 9 9m0-9-9 9"/></svg></button>
      </div>
    </div>

    <header class="topbar">
      <button id="menu-button" class="icon-button menu-button" title="Menu" aria-label="Menu"></button>
      <button id="brand-button" class="brand" title="DART — Discover Art · Home" aria-label="DART — Discover Art · Home">D<span>ART</span></button>
      <form id="search-form" class="search-form" autocomplete="off">
        <span class="search-glyph" aria-hidden="true"></span>
        <input id="search-input" name="q" type="search" placeholder="Search images and posts · Ctrl+K" aria-label="Search images and posts" aria-keyshortcuts="Control+K" maxlength="200">
        <button class="search-submit" type="submit">Find</button>
        <div id="search-popover" class="search-popover" hidden></div>
      </form>
      <div class="header-actions">
        <button id="likes-button" class="icon-button" title="Liked" aria-label="Liked"></button>
        <button id="bookmarks-button" class="icon-button" title="Bookmarks" aria-label="Bookmarks"></button>
        <button id="settings-button" class="icon-button" title="Settings" aria-label="Settings"></button>
      </div>
    </header>

    <div class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="Navigation">
        <nav class="side-nav">
          <div class="nav-group">
            <button data-nav="home" class="side-link active"><span data-icon="home"></span><span>Home</span></button>
            <button data-nav="search" class="side-link"><span data-icon="grid"></span><span>Illustrations</span></button>
            <button data-nav="adult" class="side-link"><span data-icon="heart"></span><span>NSFW illustrations</span></button>
          </div>
          <div class="nav-group separated">
            <button data-nav="recommendations" class="side-link"><span data-icon="spark"></span><span>Recommendations</span></button>
            <button data-nav="follows" class="side-link"><span data-icon="users"></span><span>Following</span></button>
            <button data-nav="likes" class="side-link"><span data-icon="heart"></span><span>Liked</span></button>
            <button data-nav="bookmarks" class="side-link"><span data-icon="bookmark"></span><span>Bookmarks</span></button>
            <button data-nav="recent" class="side-link"><span data-icon="clock"></span><span>Recently opened</span></button>
          </div>
          <div class="nav-group separated">
            <button data-nav="settings" class="side-link"><span data-icon="settings"></span><span>Sources and settings</span></button>
          </div>
        </nav>
        <div class="sidebar-footer">
          <div class="source-dots"><i class="dot danbooru"></i><i class="dot gelbooru"></i><i class="dot rule34"></i><i class="dot sankaku"></i></div>
          <span>Danbooru · Gelbooru · Rule34 · Sankaku</span>
        </div>
      </aside>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
