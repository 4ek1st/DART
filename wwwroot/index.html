<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d1d1d">
  <title>DART — Discover Art</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/catalog-logic.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/desktop-shell.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <div class="tabs-bar" aria-label="Открытые вкладки">
      <button id="install-update-button" class="install-update-button" type="button" title="Установить обновление" aria-label="Установить обновление" hidden>↑</button>
      <div class="nav-arrows">
        <button id="back-button" class="icon-button" title="Назад" aria-label="Назад"></button>
        <button id="forward-button" class="icon-button" title="Вперёд" aria-label="Вперёд"></button>
      </div>
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="tab-list-button" class="tab-list-button" title="Все вкладки" aria-label="Все вкладки" aria-expanded="false" aria-controls="tab-list-panel"></button>
      <button id="new-tab-button" class="new-tab" title="Новая вкладка" aria-label="Новая вкладка">+</button>
      <div class="window-drag-space" aria-hidden="true"></div>
      <div id="window-controls" class="window-controls" aria-label="Управление окном" hidden>
        <button type="button" data-window-command="minimize" aria-label="Свернуть" title="Свернуть"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
        <button type="button" data-window-command="maximize" aria-label="Развернуть" title="Развернуть"><svg viewBox="0 0 16 16"><path id="maximize-glyph" d="M3.5 3.5h9v9h-9z"/></svg></button>
        <button type="button" class="window-close" data-window-command="close" aria-label="Закрыть окно" title="Закрыть окно"><svg viewBox="0 0 16 16"><path d="m3.5 3.5 9 9m0-9-9 9"/></svg></button>
      </div>
    </div>

    <header class="topbar">
      <button id="menu-button" class="icon-button menu-button" title="Меню" aria-label="Меню"></button>
      <button id="brand-button" class="brand" title="DART — Discover Art · Главная" aria-label="DART — Discover Art · Главная">D<span>ART</span></button>
      <form id="search-form" class="search-form" autocomplete="off">
        <span class="search-glyph" aria-hidden="true"></span>
        <input id="search-input" name="q" type="search" placeholder="Поиск изображений и публикаций · Ctrl+K" aria-label="Поиск изображений и публикаций" aria-keyshortcuts="Control+K" maxlength="200">
        <button class="search-submit" type="submit">Найти</button>
        <div id="search-popover" class="search-popover" hidden></div>
      </form>
      <div class="header-actions">
        <button id="bookmarks-button" class="icon-button" title="Закладки" aria-label="Закладки"></button>
        <button id="settings-button" class="icon-button" title="Настройки" aria-label="Настройки"></button>
      </div>
    </header>

    <div class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="Навигация">
        <nav class="side-nav">
          <div class="nav-group">
            <button data-nav="home" class="side-link active"><span data-icon="home"></span><span>Главная</span></button>
            <button data-nav="search" class="side-link"><span data-icon="grid"></span><span>Иллюстрации</span></button>
            <button data-nav="adult" class="side-link"><span data-icon="heart"></span><span>NSFW иллюстрации</span></button>
          </div>
          <div class="nav-group separated">
            <button data-nav="recommendations" class="side-link"><span data-icon="spark"></span><span>Рекомендации</span></button>
            <button data-nav="follows" class="side-link"><span data-icon="users"></span><span>Подписки</span></button>
            <button data-nav="bookmarks" class="side-link"><span data-icon="heart"></span><span>Закладки</span></button>
            <button data-nav="recent" class="side-link"><span data-icon="clock"></span><span>Недавно открытое</span></button>
          </div>
          <div class="nav-group separated">
            <button data-nav="settings" class="side-link"><span data-icon="settings"></span><span>Источники и настройки</span></button>
          </div>
        </nav>
        <div class="sidebar-footer">
          <div class="source-dots"><i class="dot danbooru"></i><i class="dot gelbooru"></i><i class="dot rule34"></i><i class="dot sankaku"></i></div>
          <span>Danbooru · Gelbooru · Rule34 · Sankaku</span>
        </div>
      </aside>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
